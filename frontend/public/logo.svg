<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#F5F0E8"/>
  <!-- Border frame -->
  <rect x="14" y="14" width="72" height="72" rx="9" fill="none" stroke="#161510" stroke-width="2.5"/>
  <!-- Nib body: arch top, straight sides, tapers to point -->
  <path d="M 38 62 L 38 46 A 12 12 0 0 1 62 46 L 62 62 L 50 78 Z"
        fill="none" stroke="#161510" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Nib slit line -->
  <line x1="50" y1="52" x2="50" y2="74" stroke="#161510" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nib tip -->
  <ellipse cx="50" cy="75" rx="2.5" ry="3.2" fill="#161510"/>
</svg>
