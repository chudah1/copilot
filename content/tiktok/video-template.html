<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      @font-face { font-family: "BH Display"; src: url("file:///System/Library/Fonts/NewYork.ttf") format("truetype"); }
      @font-face { font-family: "BH Sans"; src: url("file:///System/Library/Fonts/SFNS.ttf") format("truetype"); }
      @font-face { font-family: "BH Mono"; src: url("file:///System/Library/Fonts/SFNSMono.ttf") format("truetype"); }
      :root { --paper:#f3eee3; --ink:#17150f; --green:#1e5c3a; --green-deep:#174d31; --muted:#746e62; --rule:#d5cebf; }
      * { box-sizing: border-box; }
      html, body { width:1080px; height:1920px; margin:0; overflow:hidden; }
      body { background:var(--ink); font-family:"BH Sans",-apple-system,sans-serif; }
      .video { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--ink); }
      .grain { position:absolute; inset:0; opacity:.055; pointer-events:none; z-index:30; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.62'/%3E%3C/svg%3E"); }
      .frame { position:absolute; inset:32px; border:1px solid rgba(243,238,227,.15); z-index:25; pointer-events:none; }
      .header { position:absolute; top:82px; left:82px; right:82px; z-index:40; display:flex; align-items:center; justify-content:space-between; color:var(--paper); }
      .brand { display:flex; align-items:center; gap:16px; font-size:24px; font-weight:750; letter-spacing:-.03em; }
      .mark { width:44px; height:44px; display:grid; place-items:center; border:1.5px solid currentColor; font:700 15px "BH Mono",monospace; }
      .series { font:700 17px "BH Mono",monospace; letter-spacing:.12em; color:#a4cbb0; }
      .scene { position:absolute; inset:0; padding:230px 88px 255px; display:flex; flex-direction:column; justify-content:center; opacity:0; transform:scale(1.025); will-change:opacity,transform; }
      .night { background:var(--ink); color:var(--paper); }
      .paper { background:var(--paper); color:var(--ink); }
      .green { background:var(--green-deep); color:var(--paper); }
      .eyebrow { margin-bottom:38px; color:#9fc7ab; font:700 20px "BH Mono",monospace; letter-spacing:.14em; text-transform:uppercase; }
      .paper .eyebrow { color:var(--green); }
      h1,h2,p { margin:0; }
      h1,h2 { font-family:"BH Display",Georgia,serif; font-weight:500; letter-spacing:-.05em; }
      h1 { font-size:142px; line-height:.94; }
      h2 { font-size:96px; line-height:1; }
      .accent { color:#9fc7ab; font-style:italic; }
      .paper .accent { color:var(--green); }
      .subcopy { max-width:820px; margin-top:48px; color:#c4bfb3; font-size:37px; line-height:1.35; }
      .paper .subcopy { color:#4b473e; }
      .money { position:relative; color:var(--paper); font:500 260px/.84 "BH Display",Georgia,serif; letter-spacing:-.075em; }
      .chart { position:absolute; left:70px; right:70px; bottom:260px; height:450px; opacity:.36; }
      .chart-grid { position:absolute; inset:0; background:repeating-linear-gradient(to bottom,transparent 0 89px,rgba(243,238,227,.22) 90px); }
      .chart svg { position:absolute; inset:0; overflow:visible; }
      .chart path { fill:none; stroke:#b8d9c2; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
      .compare { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:72px; }
      .card { min-height:430px; padding:42px 35px; border:1px solid var(--rule); display:flex; flex-direction:column; justify-content:space-between; background:rgba(255,255,255,.28); }
      .card:last-child { background:var(--green-deep); color:var(--paper); border-color:var(--green-deep); }
      .card-label { color:var(--green); font:700 18px "BH Mono",monospace; letter-spacing:.14em; }
      .card:last-child .card-label { color:#afd4b9; }
      .card-copy { font:500 51px/1.03 "BH Display",Georgia,serif; letter-spacing:-.04em; }
      .question { padding-left:50px; border-left:6px solid var(--green); font:500 88px/1.02 "BH Display",Georgia,serif; letter-spacing:-.045em; }
      .footer { position:absolute; left:82px; right:82px; bottom:115px; z-index:40; border-top:1px solid rgba(243,238,227,.22); padding-top:24px; display:flex; justify-content:space-between; color:#aaa395; font-size:19px; }
      .light-footer { color:var(--muted); border-color:var(--rule); }
      .progress { position:absolute; left:32px; right:32px; bottom:32px; z-index:45; height:5px; background:rgba(243,238,227,.12); }
      .progress > span { display:block; height:100%; background:#a8ceb3; transform-origin:left; }
      .closing-mark { width:86px; height:86px; margin-bottom:58px; display:grid; place-items:center; border:2px solid var(--paper); font:700 26px "BH Mono",monospace; }
    </style>
  </head>
  <body>
    <main class="video">
      <header class="header"><div class="brand"><span class="mark">BH</span><span>Before Hindsight</span></div><div class="series"></div></header>
      <footer class="footer"><strong>BEFORE HINDSIGHT</strong><span>No stock tips. Better decisions.</span></footer>
      <div class="frame"></div><div class="grain"></div><div class="progress"><span></span></div>
    </main>
    <script type="module">
      import { videos } from "./videos.mjs";
      import { renderSceneHTML, resolveActiveScene, sceneVisibility, sceneFadeIn, chartProgress, videoDuration } from "./video-scenes.mjs";

      const params = new URLSearchParams(location.search);
      const requestedSlug = params.get("video");
      const video = videos.find((entry) => entry.slug === requestedSlug) || videos[0];
      const duration = videoDuration(video);

      document.querySelector(".series").textContent = video.series || "";

      const videoEl = document.querySelector(".video");
      const scenesHTML = video.scenes
        .map((scene) => `<div class="scene ${scene.treatment}" data-start="${scene.start}" data-end="${scene.end}">${renderSceneHTML(scene)}</div>`)
        .join("");
      videoEl.insertAdjacentHTML("afterbegin", scenesHTML);
      const sceneEls = [...videoEl.querySelectorAll(".scene")];

      window.renderAt = (time) => {
        sceneEls.forEach((el, index) => {
          const scene = video.scenes[index];
          const visible = sceneVisibility(scene, time);
          const fadeIn = sceneFadeIn(scene, time);
          el.style.opacity = visible;
          el.style.transform = `scale(${1.025 - visible * 0.025}) translateY(${(1 - fadeIn) * 22}px)`;
        });

        const active = resolveActiveScene(video.scenes, time);
        const isPaper = active.treatment === "paper";
        document.querySelector(".header").style.color = isPaper ? "#17150f" : "#f3eee3";
        document.querySelector(".series").style.color = isPaper ? "#1e5c3a" : "#a4cbb0";
        document.querySelector(".footer").classList.toggle("light-footer", isPaper);
        document.querySelector(".progress > span").style.transform = `scaleX(${Math.min(1, Math.max(0, time / duration))})`;

        video.scenes.forEach((scene, index) => {
          if (scene.type !== "stat" || !scene.chart) return;
          const path = sceneEls[index].querySelector(".chart path");
          if (!path) return;
          const progress = chartProgress(scene, time);
          path.style.strokeDasharray = "1500";
          path.style.strokeDashoffset = String(1500 * (1 - progress));
        });
      };

      const initialTime = params.has("t") ? Number(params.get("t")) : 0;
      window.renderAt(initialTime);
      document.fonts.ready.then(() => {
        document.documentElement.dataset.ready = "true";
      });
    </script>
  </body>
</html>
